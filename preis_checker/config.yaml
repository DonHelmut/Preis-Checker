name: Preis-Checker
version: "1.2.16"
slug: preis_checker
description: Strom, Internet und Produktpreise vergleichen (Check24, Geizhals, Alternate, Mindfactory) mit Schnäppchen-Alarm
url: https://github.com/DonHelmut/Preis-Checker
arch:
  - amd64
# Fertiges Image von GitHub (ghcr.io) statt Bau in HA – Updates hinterlassen keine Reste
image: ghcr.io/donhelmut/{arch}-preis-checker
startup: application
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:tag-search
panel_title: Preis-Checker
panel_admin: false
homeassistant_api: true
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Weboberfläche/API außerhalb von HA (optional)
