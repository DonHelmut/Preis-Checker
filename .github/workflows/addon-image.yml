name: Add-on-Image

# Baut das Home-Assistant-Image schon im Pull Request, damit es beim Mergen
# (= HA sieht die neue Version) bereits zum Download bereitliegt.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Version aus config.yaml
        id: v
        run: |
          echo "version=$(grep -oP '^version: "\K[^"]+' preis_checker/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: preis_checker/Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_ARCH=amd64
          push: true
          tags: |
            ghcr.io/donhelmut/amd64-preis-checker:${{ steps.v.outputs.version }}
            ghcr.io/donhelmut/amd64-preis-checker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
